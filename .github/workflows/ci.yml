name: CI

on:
  push:
    branches: [BRICKS, main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint all shell scripts
        run: |
          set -e
          mapfile -t files < <(find . -path ./.git -prune -o -type f \( -name '*.sh' -o -name 'bashrc' \) -print)
          printf '  %s\n' "${files[@]}"
          shellcheck -x -e SC1090,SC1091,SC2016,SC2154 "${files[@]}"

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n on every script
        run: |
          set -e
          for f in $(find . -path ./.git -prune -o -type f -name '*.sh' -print); do
            bash -n "$f" && echo "  ok  $f"
          done
          bash -n bash/bashrc && echo "  ok  bash/bashrc"
